<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RTP Amiens SC">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>RTP Amiens SC</title>
<style>
:root{
  --noir:#0b0b0b; --blanc:#ffffff; --fond:#f2f2f2; --gris1:#e4e4e4; --gris2:#c9c9c9; --gris3:#8a8a8a; --gris4:#555; --texte:#141414;
  --vert:#1f9d55; --orange:#e08a00; --rouge:#d64545;
  --cond:"Avenir Next Condensed","DIN Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
/* bandeau */
.top{background:var(--noir);color:#fff;display:flex;align-items:center;gap:16px;padding:calc(10px + env(safe-area-inset-top)) 20px 10px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:260px;background:repeating-linear-gradient(115deg,transparent 0 22px,#3a3a3a 22px 34px,transparent 34px 52px,#6b6b6b 52px 58px);opacity:.55;pointer-events:none}
.top img{height:58px;width:auto;display:block;position:relative;z-index:1}
.top .t{position:relative;z-index:1;line-height:1}
.top .t small{display:block;font-family:var(--cond);font-weight:600;letter-spacing:.08em;font-size:15px;color:#cfcfcf;text-transform:uppercase}
.top .t b{display:block;font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase}
.nav{display:flex;gap:4px;background:#1c1c1c;padding:0 12px;overflow-x:auto}
.nav a{color:#bdbdbd;text-decoration:none;padding:12px 14px;font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border-bottom:3px solid transparent}
.nav a.on{color:#fff;border-bottom-color:#fff}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.03em;margin:0}
h1{font-size:30px}
h2{font-size:22px}
.secbar{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.secbar h2{background:var(--noir);color:#fff;padding:6px 26px 6px 14px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);font-size:19px}
.secbar .sp{flex:1}
.card{background:#fff;border:1px solid var(--gris1);border-radius:12px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--gris4);font-weight:600}
label.f>span{text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=date],select,input[type=search]{border:1px solid var(--gris2);border-radius:8px;padding:9px 10px;background:#fff;min-height:42px;font-size:16px}
input.n{width:76px;text-align:center;padding:9px 4px}
input.n.w{width:92px}
.btn{border:1.5px solid var(--noir);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:42px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em;font-size:16px}
.btn.p{background:var(--noir);color:#fff}
.btn.s{border-color:var(--gris2);color:var(--gris4)}
.btn.d{border-color:var(--rouge);color:var(--rouge)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
.muted{color:var(--gris3)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--gris1);color:var(--gris4);white-space:nowrap}
.chip.vert{background:var(--vert);color:#fff}.chip.orange{background:var(--orange);color:#fff}.chip.rouge{background:var(--rouge);color:#fff}
.chip.dark{background:var(--noir);color:#fff}
.chip.line{background:#fff;border:1px solid var(--gris2)}
table.l{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--gris1)}
table.l th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em;font-size:14px;text-align:left;background:#f7f7f7;color:var(--gris4);padding:10px 12px;border-bottom:1px solid var(--gris1)}
table.l td{padding:12px;border-bottom:1px solid var(--gris1);vertical-align:middle}
table.l tr.click{cursor:pointer}
table.l tr.click:active{background:#f4f4f4}
.empty{padding:30px;text-align:center;color:var(--gris3);background:#fff;border:1px dashed var(--gris2);border-radius:12px}
/* séance */
.seance{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media (max-width:980px){.seance{grid-template-columns:1fr}}
.side{position:sticky;top:10px}
@media (max-width:980px){.side{position:static;order:-1}}
.test{background:#fff;border:1px solid var(--gris1);border-radius:12px;margin:10px 0;overflow:hidden}
.test.st-vert{border-left:6px solid var(--vert)}.test.st-orange{border-left:6px solid var(--orange)}.test.st-rouge{border-left:6px solid var(--rouge)}
.test .hd{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 6px}
.test .hd h3{font-size:19px;flex:1}
.test .pr{padding:0 14px 8px;font-size:13px;color:var(--gris4)}
.test .bd{padding:6px 14px 12px;display:flex;flex-direction:column;gap:10px}
.fld{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fld>.lab{min-width:150px;font-size:14px;font-weight:600;color:#333}
.side-l{font-family:var(--cond);font-weight:700;font-size:16px;width:26px;text-align:center;color:var(--gris4)}
.side-l.les{color:#fff;background:var(--noir);border-radius:6px}
.unit{font-size:13px;color:var(--gris3)}
.tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gris2);border-radius:999px;padding:7px 12px;background:#fff;cursor:pointer;user-select:none;min-height:40px;font-size:14px}
.tog input{width:20px;height:20px;accent-color:#111}
.tog.on{background:#111;color:#fff;border-color:#111}
.res{background:#f7f7f7;border-top:1px solid var(--gris1);padding:10px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.res .cr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res .cr b{min-width:96px}
.ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px 12px;border-top:1px dashed var(--gris1);font-size:13px;color:var(--gris4)}
.ft select{min-height:34px;padding:4px 8px;font-size:14px}
.refbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fafafa;border:1px dashed var(--gris2);border-radius:10px;padding:8px 10px;font-size:13px}
.verdict{border-radius:12px;padding:14px;color:#fff;background:var(--gris4)}
.verdict.vert{background:var(--vert)}.verdict.orange{background:var(--orange)}.verdict.rouge{background:var(--rouge)}
.verdict b{display:block;font-family:var(--cond);font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.verdict small{font-size:13px;opacity:.95}
.miss{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.miss li{padding:7px 0;border-bottom:1px solid var(--gris1);display:flex;gap:8px;align-items:flex-start}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;background:var(--gris2)}
.dot.vert{background:var(--vert)}.dot.orange{background:var(--orange)}.dot.rouge{background:var(--rouge)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi div{background:#fff;border:1px solid var(--gris1);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--cond);font-size:30px}
.kpi span{font-size:13px;color:var(--gris4);text-transform:uppercase;letter-spacing:.04em}
.foot{text-align:center;font-size:12px;color:var(--gris3);padding:20px}
#print{display:none}
.ph{border-radius:12px;background:#d9d9d9;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--cond);font-weight:700;color:#777;font-size:20px;text-transform:uppercase}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.ccard{display:flex;gap:12px;background:#fff;border:1px solid var(--gris1);border-radius:12px;padding:12px;cursor:pointer;align-items:flex-start}
.ccard:active{background:#f4f4f4}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{display:flex;height:14px;background:var(--gris1);border-radius:4px;overflow:hidden}
.bar .bt i{display:block;height:100%}
.bar .bv{font-variant-numeric:tabular-nums;color:var(--gris4);white-space:nowrap}
.zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
.zone{background:#fff;border:1px solid var(--gris1);border-radius:12px;padding:12px 14px}
.zone h3{font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.zone .l{font-size:14px;padding:5px 0;border-bottom:1px solid #f0f0f0}
.zone .l i{font-style:normal;color:var(--gris3);font-size:12px;text-transform:uppercase;margin-right:6px}
.micb{border:1.5px solid var(--noir);background:#fff;border-radius:999px;min-height:36px;padding:4px 12px;display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:14px;cursor:pointer;font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em}
.micb.on{background:#111;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.micb svg{width:16px;height:16px}
textarea{width:100%;border:1px solid var(--gris2);border-radius:8px;padding:10px;font:inherit;font-size:16px;min-height:70px;background:#fff}
.dic{padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--gris1);background:#fafafa}
.dicrep{font-size:13px;color:var(--gris4);white-space:pre-line}
.files li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--gris1);flex-wrap:wrap}
.files{list-style:none;margin:0 0 10px;padding:0}
/* fiche PDF */
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  #app,.toast{display:none!important}
  #print{display:block}
  .pf-top{background:#000!important;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative;overflow:hidden}
  .pf-top img{height:62px}
  .pf-top small{display:block;font-family:var(--cond);font-size:14px;letter-spacing:.08em;color:#ccc;text-transform:uppercase}
  .pf-top b{display:block;font-family:var(--cond);font-size:34px;text-transform:uppercase;line-height:1}
  .pf-top::after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:200px;background:repeating-linear-gradient(115deg,transparent 0 18px,#444 18px 28px,transparent 28px 44px,#777 44px 48px);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pf-id{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px;font-size:11.5px;margin:10px 0;border:1px solid #bbb;border-radius:8px;padding:8px 10px}
  .pf-v{border-radius:8px;padding:8px 12px;color:#fff;font-family:var(--cond);font-size:20px;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#555}
  .pf-v.vert{background:var(--vert)}.pf-v.orange{background:var(--orange)}.pf-v.rouge{background:var(--rouge)}
  .pf-h{font-family:var(--cond);text-transform:uppercase;background:#000;color:#fff;display:inline-block;padding:3px 18px 3px 10px;margin:10px 0 4px;font-size:14px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.pf{width:100%;border-collapse:collapse;font-size:10.5px}
  table.pf th{text-align:left;border-bottom:1.5px solid #000;padding:3px 4px;font-family:var(--cond);text-transform:uppercase;font-size:11px}
  table.pf td{border-bottom:1px solid #ddd;padding:3px 4px;vertical-align:top}
  .pf-s{display:inline-block;padding:1px 7px;border-radius:999px;color:#fff;font-weight:700;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#888}
  .pf-s.vert{background:var(--vert)}.pf-s.orange{background:var(--orange)}.pf-s.rouge{background:var(--rouge)}
  .pf-foot{margin-top:12px;border-top:1.5px solid #000;padding-top:5px;font-size:10px;display:flex;justify-content:space-between;font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em}
  .pf-note{font-size:10px;color:#444;margin-top:6px}
}
</style>
</head>

/* Fichiers (photos des joueurs, fichiers GPS joints) : base IndexedDB de l'iPad */
const IDB = {
  _db:null,
  open(){ return new Promise((res,rej)=>{ if(this._db) return res(this._db); if(!window.indexedDB) return rej(new Error('IndexedDB indisponible')); const r=indexedDB.open('rtp-amiens-sc',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>{ this._db=r.result; res(this._db); }; r.onerror=()=>rej(r.error); }); },
  async tx(mode, fn){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction('files',mode); const rq=fn(t.objectStore('files')); let out; if(rq) rq.onsuccess=()=>{ out=rq.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  put(k,v){ return this.tx('readwrite', st=>st.put(v,k)); },
  get(k){ return this.tx('readonly', st=>st.get(k)); },
  del(k){ return this.tx('readwrite', st=>st.delete(k)); },
  keys(){ return this.tx('readonly', st=>st.getAllKeys()); }
};
const PHOTOS = {};

function b642buf(b64){ const s=atob(b64); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b.buffer; }

function protoTxt(t){
  const p = t.protocole; if(!p) return '';
  const out=[];
  for(const [k,v] of Object.entries(p)){
    if(!(k in PK)) continue;
    let val = Array.isArray(v) ? v.join(' / ') : (typeof v==='object' ? null : v);

/* ============ MOTEUR DE CALCUL ============ */
const MIN_BEST = new Set(['ake','thomas_modifie','bkfo','sprint_10m','sprint_30m']);
function aggMode(t){ const ag = String((t.protocole||{}).agregation||''); if(/moyenne/.test(ag)) return 'mean'; if(MIN_BEST.has(t.id)) return 'min'; return 'max'; }
function agg(arr, mode){ const a = arr.filter(x=>x!=null); if(!a.length) return null; if(mode==='min') return Math.min(...a); if(mode==='mean') return a.reduce((s,x)=>s+x,0)/a.length; return Math.max(...a); }
function vals(v, champ, side, n){ const base = side ? `${champ}_${side}` : champ; if(!n || n<=1) return [nv(v[base])]; return Array.from({length:n}, (_,i)=>nv(v[`${base}_${i}`])); }
const isPain = (s,t) => /^douleur/.test(s.champ) && t.id!=='hagos' && t.id!=='palpation';
function mainField(t, bil){ return (t.saisie||[]).find(s=>!/^douleur/.test(s.champ) && (s.type==='nombre'||s.type==='entier') && (bil==null || !!s.bilateral===bil)); }
function painMax(t, v){ let m=null; for(const s of (t.saisie||[])){ if(!isPain(s,t)) continue; for(const side of (s.bilateral?['G','D']:[null])){ const x = nv(v[side?`${s.champ}_${side}`:s.champ]); if(x!=null) m = Math.max(m==null?0:m, x); } } return m; }
function applyPain(t, st, dmax){
  if(t.douleur_max===null || dmax==null || !RANK[st]) return st;
  const lim = (t.douleur_max==null) ? 2 : t.douleur_max;
  if(dmax > lim){ if(t.douleur_effet==='statut_rouge') return 'rouge'; return st==='rouge' ? 'rouge' : 'orange'; }
  return st;
}
function kind(t){
  const id=t.id, c=String(t.calcul||'');
  if(t.type_test==='checklist_medicale') return 'checklist';
  if(t.type_test==='test_clinique') return 'positif';
  if(t.type_test==='critere_temps') return 'delai';
  if(t.type_test==='score_composite') return 'score';
  if(id==='hagos') return 'display';
  if(id==='epanchement') return 'ordinal';
  if(/paliers_valides/.test(c)) return 'paliers';
  if(id==='cod_angles') return 'cases_uni';
  if(id==='appui_30s') return 'appui';
  if(id==='nordic') return 'niveau_ref';
  if(id==='reverse_nordic') return 'palier_ref';
  if(id==='sebt') return 'sebt';
  if(t.derive_de) return 'derived';
  if(id==='squeeze') return 'squeeze';
  if(id==='uq_ybt') return 'uqybt';
  if(id==='iso_mvc_re_ri' || id==='ash_iyt') return 'multi';
  if(id==='pogo_uni') return 'pogo';
  if(/nombre_cases_cochees_cote_lese/.test(c)) return 'cases_bilat';
  const m = mainField(t); if(m && m.bilateral) return 'bilat';
  return 'uni';
}
function variantOf(t, v){ if(!(t.criteres||[]).some(c=>c.condition)) return ''; const l=(t.saisie||[]).find(s=>s.type==='liste'); return l ? (v[l.champ]||'') : ''; }
/* Liste des valeurs de référence (présaison) qu'un test utilise */
function refKeys(t, v){
  const k = kind(t), out=[];
  const pres = (t.criteres||[]).some(c=>c.id==='presaison');
  if((k==='bilat'||k==='pogo') && pres){ const va=variantOf(t,v); const m=mainField(t,true); out.push({key:t.id+(va?':'+va:''), side:true, lab:'Réf. présaison côté lésé'+(va?' ('+optLab(va)+')':''), u:m&&m.unite}); }
  if(k==='uni'){ const cs=[t.calcul, ...(t.criteres||[]).map(c=>c.calcul)].join(' '); const m=mainField(t,false); if(/reference/.test(cs)) out.push({key:t.id, lab:'Référence du joueur', u:m&&m.unite}); if(t.id==='sprint_30m') out.push({key:t.id+':vmax', lab:'Réf. Vmax', u:'km/h'}); }
  if(k==='multi'){ for(const s of t.saisie.filter(s=>/^force_/.test(s.champ))){ const suf=s.champ.replace('force_',''); out.push({key:t.id+':'+suf, side:true, lab:'Réf. présaison '+labelChamp(s)+' (lésé)', u:'N'}); } }
  if(k==='squeeze'){ out.push({key:'squeeze:0', lab:'Réf. présaison 0°', u:'N'}, {key:'squeeze:45', lab:'Réf. présaison 45°', u:'N'}); }
  if(k==='niveau_ref') out.push({key:t.id, lab:'Niveau de présaison', u:'cran/°'});
  if(k==='palier_ref') out.push({key:t.id, lab:'Palier de présaison (1 à 4)', u:''});
  return out;
}
function crit(lab, val, u, seuils){ return {lab, val, u, seuils, statut:evalSeuils(seuils, val)}; }
function finish(t, v, crits, res){
  res.crits = crits; res.dmax = painMax(t, v);
  if(crits.some(c=>c.missing)) res.statut='manquant';
  else { const act = crits.filter(c=>!c.skip); res.statut = act.length ? worst(act.map(c=>c.statut)) : 'non_calcule'; if(!res.statut && act.length) res.statut='manquant'; }
  res.statut = applyPain(t, res.statut, res.dmax);
  return res;
}
function cBilat(t, v, ctx, champOverride){
  const m = champOverride || mainField(t, true);
  const n = m.essais||1, mode = aggMode(t);
  const G = agg(vals(v,m.champ,'G',n),mode), D = agg(vals(v,m.champ,'D',n),mode);
  const L = ctx.cote==='G'?G:D, S = ctx.cote==='G'?D:G;
  const res = {G, D, L, S, x:L, unit:m.unite, lignes:[]};
  const va = variantOf(t, v);
  const list = t.criteres ? t.criteres.map(c=>({id:c.id, calc:c.calcul, seuils:c.seuils})) : [{id:'', calc:t.calcul, seuils:t.seuils}];
  const crits = list.map(c=>{
    const calc = String(c.calc||'');
    if(c.id==='presaison'){ const ref = ctx.ref(t.id+(va?':'+va:'')); if(ref==null) return {skip:true, lab:'% présaison', note:'réf. non saisie'}; if(L==null) return {missing:true}; return crit('% présaison', L/ref*100, '%', c.seuils); }
    if(c.id==='absolu' || /valeur_absolue_cote_lese/.test(calc)){ if(L==null) return {missing:true}; return crit('Côté lésé', L, m.unite, c.seuils); }
    if(/^abs\(/.test(calc)){ if(G==null||D==null) return {missing:true}; const e=Math.abs(G-D); res.ecart=e; return crit('Écart G-D', e, m.unite, c.seuils); }
    if(L==null||S==null||L===0||S===0) return {missing:true};
    const lsi = /sain \/ lese/.test(calc) ? S/L*100 : L/S*100; res.lsi = lsi;
    return crit('LSI', lsi, '%', c.seuils);
  });
  if(res.lsi==null && L!=null && S) res.lsi = (t.sens==='plus_petit_meilleur') ? S/L*100 : L/S*100;
  if(ctx.poids && /^force/.test(m.champ) && L!=null && ((t.calculs_affiches||[]).includes('n_par_kg'))) res.nkg = L/ctx.poids;
  return finish(t, v, crits, res);
}
function cUni(t, v, ctx){
  const m = t.id==='palpation' ? t.saisie[0] : mainField(t, false);
  const x = agg(vals(v,m.champ,null,m.essais||1), aggMode(t));
  const res = {x, unit:m.unite};
  const one = (calc, seuils, id) => {
    calc = String(calc||'');
    if(id==='vmax_gps'){ const vm = nv(v.vmax_gps); if(vm==null) return {skip:true, lab:'Vmax', note:'non saisie'}; const ref=ctx.ref(t.id+':vmax'); if(ref==null) return {skip:true, lab:'Vmax % réf.', note:'réf. non saisie'}; return crit('Vmax % réf.', vm/ref*100, '%', seuils); }
    if(x==null) return {missing:true};
    if(/reference \/ actuel/.test(calc)){ const ref=ctx.ref(t.id); if(ref==null) return {skip:true, lab:'% référence', note:'réf. non saisie'}; if(!x) return {missing:true}; res.pct=ref/x*100; return crit('% référence', res.pct, '%', seuils); }
    if(/actuel \/ reference/.test(calc)){ const ref=ctx.ref(t.id); if(ref==null) return {skip:true, lab:'% référence', note:'réf. non saisie'}; res.pct=x/ref*100; return crit('% référence', res.pct, '%', seuils); }
    return crit('Valeur', x, m.unite, seuils);
  };
  const crits = t.criteres ? t.criteres.map(c=>one(c.calcul, c.seuils, c.id)) : [one(t.calcul, t.seuils)];
  return finish(t, v, crits, res);
}
function boolCount(t, v, side){ return t.saisie.filter(s=>s.type==='booleen' && s.champ!=='valgus_dynamique' && s.champ!=='mode_sans_appareil').filter(s=>!!v[side?`${s.champ}_${side}`:s.champ]).length; }
function compute(t, v, ctx){
  v = v || {};
  const k = kind(t);
  const fait = !!v.__fait;
  const need = () => ({statut:'manquant', crits:[]});
  switch(k){
    case 'bilat': return cBilat(t, v, ctx);
    case 'uni': return cUni(t, v, ctx);
    case 'pogo': { const sans=!!v.mode_sans_appareil; const m=t.saisie.find(s=>s.champ===(sans?'rebonds_15s':'rsi_moyen')); return cBilat(t, v, ctx, m); }
    case 'checklist': { if(!fait) return need(); const n=boolCount(t,v,null); const tot=t.saisie.length; const r={x:n, crits:[crit('Cases cochées', n, '/ '+tot, t.seuils)]}; r.statut=r.crits[0].statut; return r; }
    case 'positif': { if(!fait) return need(); const pos = t.calcul==='au_moins_un_positif' ? !!(v.apprehension_positif||v.relocation_positif) : !!v.positif; const st=evalSeuils(t.seuils,pos); return {x:pos, statut:st, crits:[{lab:'Résultat', txt:pos?'Positif':'Négatif', statut:st}]}; }
    case 'appui': { if(!fait) return need(); const d=nv(v.douleur)||0; const ok=!!v.tenu_30s && d<=2; const st=ok?'vert':'rouge'; return {statut:st, crits:[{lab:'Résultat', txt:(v.tenu_30s?'Tenu 30 s':'Non tenu')+' · douleur '+d+'/10', statut:st}]}; }
    case 'ordinal': { const s=t.saisie[0]; const i=s.options.indexOf(v.grade); if(i<0) return need(); const val=s.valeurs[i]; const st=evalSeuils(t.seuils,val); return {x:val, statut:st, crits:[{lab:'Grade', txt:v.grade, statut:st}]}; }
    case 'delai': { if(!v.date_chirurgie || !ctx.date) return need(); const a=new Date(v.date_chirurgie), b=new Date(ctx.date); let mo=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); if(b.getDate()<a.getDate()) mo--; const st=evalSeuils(t.seuils,mo); return {x:mo, statut:st, crits:[crit('Mois depuis la chirurgie', mo, 'mois', t.seuils)]}; }
    case 'paliers': {
      if(!fait) return need();
      const req = t.saisie.filter(s=>Number(s.etape)<=ctx.visee);
      const ok = req.every(s=>!!v[s.champ]);

      if(!best || d>2) st='rouge'; else { const ref=ctx.ref(t.id); if(ref==null) return {statut:'non_calcule', crits:[{lab:'Résultat', txt:txt+' · palier de présaison non saisi'}]}; st = best>=ref ? 'vert' : 'orange'; txt+=` · présaison palier ${fmt(ref)}`; }

    case 'sebt': {

      return finish(t, v, crits, r);

/* tests dérivés et scores (calculés après les autres) */
function computeDerived(t, R, V, ctx, ref){
  if(t.id==='sebt_composite' || t.id==='sebt_bonus_ant' || t.id==='sebt_bonus_pm' || t.id==='sebt_asym_ant'){
    const s=R.sebt; if(!s || s.statut==='manquant') return {statut:'manquant', crits:[]};
    const m=s.means, Lc=ctx.cote, len=ctx.longueur && ctx.longueur[Lc];
    if(t.id==='sebt_asym_ant'){ const e=Math.abs(m.G.anterieure-m.D.anterieure); const c=crit('Asymétrie antérieure', e, 'cm', t.seuils); return {x:e, statut:c.statut, crits:[c]}; }
    if(!len) return {statut:'manquant', crits:[{lab:'', txt:'Longueur du membre lésé à saisir'}]};
    if(t.id==='sebt_composite'){ const x=(m[Lc].anterieure+m[Lc].postero_mediale+m[Lc].postero_laterale)/(3*len)*100; const c=crit('Composite (lésé)', x, '%', t.seuils); let st=c.statut; st=applyPain(t, st, s.dmax); return {x, statut:st, crits:[c]}; }
    const d = t.id==='sebt_bonus_ant' ? 'anterieure' : 'postero_mediale'; const x=m[Lc][d]/len*100;
    return {x, statut:'info', crits:[{lab:'Normalisé (lésé)', txt:fmt(x)+' %'}]};
  }
  if(t.id==='ratio_iq'){
    const q=R.force_quadriceps, i=R.force_ischios; const aq=(V.force_quadriceps||{}).appareil, ai=(V.force_ischios||{}).appareil;
    if(!q||!i||q.L==null||i.L==null||!aq||!ai) return {statut:'manquant', crits:[]};
    if(aq!==ai) return {statut:'manquant', crits:[{lab:'', txt:'Les deux tests doivent être faits avec le même appareil'}]};
    const x=i.L/q.L; const se=t.seuils_par_appareil[aq];
    if(!se) return {x, statut:'info', appareil:aq, crits:[{lab:'Ratio I/Q (lésé)', txt:fmt(x,2)+' · affiché sans seuil (Kinvent)'}]};
    const c=crit('Ratio I/Q (lésé)', x, '', se); return {x, statut:c.statut, appareil:aq, crits:[c]};
  }
  if(t.id==='ratio_add_abd'){ const a=R.force_adducteurs, b=R.force_abducteurs; if(!a||!b||a.L==null||!b.L) return {statut:'manquant', crits:[]}; const x=a.L/b.L*100; const c=crit('Add/Abd (lésé)', x, '%', t.seuils); return {x, statut:c.statut, crits:[c]}; }
  if(t.id==='ratio_re_ri'){ const s=R.iso_mvc_re_ri; if(!s||!s.Lf||s.Lf.force_re==null||!s.Lf.force_ri) return {statut:'manquant', crits:[]}; const x=s.Lf.force_re/s.Lf.force_ri; const c=crit('RE/RI (lésé)', x, '', t.seuils); return {x, statut:c.statut, crits:[c]}; }
  return {statut:'manquant', crits:[]};
}
function pointsFor(paliers, x){ if(x==null) return null; for(const p of paliers){ if(cmp(p.op, x, p.val)) return p.points; } return 0; }
function computeScore(t, R, V){
  const lines=[]; let total=0; const missing=[];
  const req = t.items_requis || [];
  for(const it of t.bareme){
    let x=null, pts=null;
    if(it.item==='apprehension'){
      const n = it.tests.filter(id=>R[id] && R[id].statut!=='manquant').length;
      if(n<it.tests.length){ missing.push('appréhension'); continue; }
      pts = it.tests.filter(id=>!(V[id]||{}).apprehension).length * it.points_par_test_sans_apprehension;
      lines.push([ 'Sans appréhension', `${pts} / ${it.max}` ]); total+=pts; continue;
    }
    const r = R[it.item];
    if(!r || r.statut==='manquant'){ missing.push(it.item); continue; }
    if(it.critere==='lsi') x=r.lsi; else if(it.item==='single_leg_landing') x=r.x; else x=(r.L!=null?r.L:r.x);
    pts = pointsFor(it.paliers, x);
    if(it.zero_si && r.dmax!=null && r.dmax>2) pts=0;
    if(it.penalite && r.valgus) pts += it.penalite.points;
    lines.push([it.item, `${pts} / ${it.max}`, x]); total+=pts;
  }
  if(missing.length) return {statut:'manquant', crits:[{lab:'', txt:'Items à saisir avant calcul'}], missing};
  let x = total, u='points';
  if(t.max_points){ x = Math.max(0,total)/t.max_points*100; u='%'; }
  const c=crit(t.max_points?'Score (% du max)':'Total', x, u, t.seuils);
  const r={x, total, statut:c.statut, crits:[c], lines};
  if(t.max_points) c.txt2 = `${Math.max(0,total)} / ${t.max_points} points`; else c.txt2 = `${total} / ${t.max} points`;
  return r;
}
/* Visibilité d'un test selon l'épisode, le poste et l'étape visée */
function minEtape(t){ return Array.isArray(t.etape) ? Math.min(...t.etape) : Number(t.etape||0); }
function visible(t, ep, j, visee){
  if(minEtape(t) > visee) return false;
  if(Array.isArray(t.applique_a)){ const types=(ep.classif||{}).type_blessure_hanche||[]; if(types.length && !t.applique_a.some(a=>types.includes(a))) return false; }
  if(t.applique_a_poste){ const p = j.poste==='gardien' ? 'gardien' : 'joueur_de_champ'; if(!t.applique_a_poste.includes(p)) return false; }
  const c = t.condition_affichage||'';
  if(/recidive/.test(c) && !ep.recidive) return false;
  if(/lca_opere/.test(c) && !ep.lca_opere) return false;
  if(/instabilite_luxation/.test(c) && !((ep.classif||{}).type_lesion_epaule||[]).includes('instabilite_luxation')) return false;
  return true;
}
function isBloquant(t, r){ if(t.id==='ratio_iq') return r && r.appareil==='isocinetisme'; return t.bloquant===true; }
/* Évaluation complète d'une séance */
function evaluate(se){
  const ep = getEp(se.episodeId), j = getJ(ep.joueurId), ref = REFS[ep.categorie];
  const visee = Number(se.etapeVisee);
  const R={}, V=se.valeurs||{};
  const RJ = db.refs[j.id]||{};
  const ctx = {cote:ep.cote, visee, date:se.date, ref:k=>{ const a=nv(RJ[k+'@'+ep.cote]); return a!=null ? a : nv(RJ[k]); },
    poids: nv(((db.refs[j.id])||{})['commun:poids_corps']),
    longueur: {G:nv(((db.refs[j.id])||{})['commun:longueur_membre_G']), D:nv(((db.refs[j.id])||{})['commun:longueur_membre_D'])}};
  const tests = ref.tests.filter(t=>visible(t, ep, j, visee));
  for(const t of tests){ const k=kind(t); if(k==='derived'||k==='score') continue; R[t.id]=compute(t, V[t.id], ctx); }
  for(const t of tests){ if(kind(t)==='derived') R[t.id]=computeDerived(t, R, V, ctx, ref); }
  for(const t of tests){ if(kind(t)==='score') R[t.id]=computeScore(t, R, V); }
  // forçages
  for(const t of tests){ const f=(se.forcages||{})[t.id]; if(f && f.statut){ R[t.id].calcule=R[t.id].statut; R[t.id].statut=f.statut; R[t.id].force=f; } }
  const bl = tests.filter(t=>isBloquant(t, R[t.id]));
  let verdict;
  const sts = bl.map(t=>R[t.id].statut);
  if(sts.includes('rouge')) verdict='rouge';
  else if(sts.some(s=>s==='manquant'||s==='non_calcule')) verdict='incomplet';
  else if(sts.includes('orange')) verdict='orange';
  else verdict='vert';
  const probl = bl.filter(t=>R[t.id].statut!=='vert');
  const discuter = tests.filter(t=>!isBloquant(t,R[t.id]) && (R[t.id].statut==='orange'||R[t.id].statut==='rouge'));
  const pres = tests.map(t=>({t, items:presOf(t, R[t.id], {ep, j, se})})).filter(x=>x.items.length);
  return {ep, j, ref, tests, R, verdict, probl, discuter, ctx, visee, se, pres};
}

const PRES_S = [{statut:'vert',op:'>=',val:90},{statut:'orange',op:'>=',val:80},{statut:'rouge',op:'<',val:80}];
/* Renvoie, pour un test, les valeurs de présaison du joueur et le % atteint par le côté lésé */
function presOf(t, r, ev){
  if(!r) return [];
  const RJ = db.refs[ev.j.id]||{}, cote = ev.ep.cote, k = kind(t), out = [];
  const g = key => nv(RJ[key+'@G']), d = key => nv(RJ[key+'@D']);
  const item = (lab, key, L, u, petit) => { const G=g(key), D=d(key); if(G==null && D==null) return; const ref = cote==='G'?G:D; let pct=null; if(ref!=null && L!=null && L>0 && ref>0) pct = petit ? ref/L*100 : L/ref*100; out.push({lab, G, D, L, pct, u, statut: pct==null?null:evalSeuils(PRES_S,pct)}); };
  if(k==='bilat' || k==='pogo'){ const v=(ev.se.valeurs||{})[t.id]||{}; const va=variantOf(t,v); const m=mainField(t,true); item('Présaison', t.id+(va?':'+va:''), r.L, va==='kinvent'?'N':(va==='isocinetisme'?'N·m':(m&&m.unite)), t.sens==='plus_petit_meilleur'); }
  if(k==='multi'){ for(const s of t.saisie.filter(s=>/^force_/.test(s.champ))){ const suf=s.champ.replace('force_',''); item('Présaison '+labelChamp(s), t.id+':'+suf, (r.Lf||{})[s.champ], 'N'); } }
  const c = (db.cartes||{})[ev.j.id]; const V = c ? (c.valeurs||{}) : {};
  const lsiKey = {single_hop:'lsi_hop', side_hop_genou:'lsi_side', crossover_hop:'lsi_cross', triple_hop:'lsi_triple', force_everseurs:'everseurs_lsi'}[t.id];
  if(lsiKey && V[lsiKey]!=null && out.length) out[out.length-1].lsiPre = V[lsiKey];
  else if(lsiKey && V[lsiKey]!=null) out.push({lab:'LSI présaison', txt: fmt(V[lsiKey])+' %'});
  if(t.id==='sebt' && (V.ybt_ant_G_cm!=null || V.ybt_ant_D_cm!=null)) out.push({lab:'Y-Balance présaison', txt:`G : A ${fmt(V.ybt_ant_G_cm)} · PM ${fmt(V.ybt_pm_G_cm)} · PL ${fmt(V.ybt_pl_G_cm)} cm | D : A ${fmt(V.ybt_ant_D_cm)} · PM ${fmt(V.ybt_pm_D_cm)} · PL ${fmt(V.ybt_pl_D_cm)} cm (Y-Balance, non normalisé)`});
  if(t.id==='ratio_iq' && V['ratio_hq_'+cote]!=null) out.push({lab:'Présaison', txt:`I/Q côté lésé ${fmt(V['ratio_hq_'+cote],2)} (Kinvent)`, ref:V['ratio_hq_'+cote], L:r.x});
  if(t.id==='ratio_add_abd' && V['ratio_add_abd_'+cote]!=null) out.push({lab:'Présaison', txt:`Add/Abd côté lésé ${fmt(V['ratio_add_abd_'+cote]*100)} %`, ref:V['ratio_add_abd_'+cote]*100, L:r.x});
  if(t.id==='ratio_re_ri' && V['ratio_re_ri_'+cote]!=null) out.push({lab:'Présaison', txt:`RE/RI côté lésé ${fmt(V['ratio_re_ri_'+cote],2)}`, ref:V['ratio_re_ri_'+cote], L:r.x});
  return out;
}
function presTxt(p){ if(p.txt) return p.txt; let s=`G ${fmt(p.G)} · D ${fmt(p.D)} ${p.u||''}`; if(p.lsiPre!=null) s+=` (LSI ${fmt(p.lsiPre)} %)`; if(p.pct!=null) s+=` → côté lésé à ${fmt(p.pct)} % de sa valeur de présaison`; return s; }
const CAT_ZONE = {cheville:'cheville',mollet:'cheville',genou:'genou',quadriceps:'genou',ischio_jambiers:'ischio',pubalgie:'hanche',hanche:'hanche',epaule:'epaule'};
const nkey = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
const ZST = {high:['rouge','À risque'], watch:['orange','À surveiller'], ok:['vert','Normal']};
const zoneChip = z => { const m=ZST[z.statut]; return m ? chip(m[0], m[1]) : chip('', z.libelle||'Non évalué'); };
function zoneOf(jid, cat){ const c=(db.cartes||{})[jid]; if(!c) return null; const k=CAT_ZONE[cat]; return (c.zones||[]).find(z=>nkey(z.nom).startsWith(k)) || null; }
function critTxt(c){ if(c.missing) return ''; if(c.txt!=null) return c.txt; if(c.skip) return c.note||''; return `${fmt(c.val)}${c.u?(c.u.startsWith('/')?' '+c.u:' '+c.u):''}`; }
function raison(t, r){
  if(r.force) return `forcé (${r.force.motif||'motif non précisé'})`;
  if(r.statut==='manquant') return 'à saisir';
  if(r.statut==='non_calcule') return 'valeur de référence du joueur à saisir';
  const bad = (r.crits||[]).filter(c=>c.statut && c.statut!=='vert').map(c=>`${c.lab} ${critTxt(c)}${c.seuils?' (seuil '+seuilsTxt(c.seuils).split(' · ')[0].replace('vert ','')+')':''}`);
  if(r.dmax!=null && r.dmax>2) bad.push(`douleur ${r.dmax}/10`);

}

async function importCartes(data){
  if(!data || data.type!=='rtp-amiens-sc-cartes-medicales' || !Array.isArray(data.cartes)) throw new Error('format');
  db.cartes = db.cartes || {};
  let cree=0, maj=0;
  for(const c of data.cartes){
    const key = nkey(c.prenom+c.nom);
    let j = db.joueurs.find(x=>nkey(x.prenom+x.nom)===key || nkey(x.nom+x.prenom)===key);
    if(!j){ j={id:uid(), nom:c.nom, prenom:c.prenom, naissance:c.naissance||'', groupe:c.groupe, poste:c.poste, pied:'D', bras:'D'}; db.joueurs.push(j); cree++; }
    else { maj++; if(!j.naissance) j.naissance=c.naissance||''; }
    const {photo, ...rest} = c;
    db.cartes[j.id] = {...rest, importe:today()};
    if(photo){ try{ await IDB.put('photo:'+j.id, photo); PHOTOS[j.id]=photo; }catch(e){} }
    const R = db.refs[j.id] = db.refs[j.id]||{};
    const setGD = (keys, o) => { if(!o) return; for(const k of keys){ if(o.G!=null) R[k+'@G']=String(o.G); if(o.D!=null) R[k+'@D']=String(o.D); } };
    const K = c.kinvent||{}, V = c.valeurs||{};
    setGD(['force_everseurs'], K.everseurs);
    setGD(['force_adducteurs','force_adduction'], K.adduction);
    setGD(['force_abducteurs','force_abduction'], K.abduction);
    setGD(['force_quadriceps_kinvent','force_quadriceps:kinvent'], K.quadriceps_60);
    setGD(['force_iso_30','force_ischios:kinvent'], K.ischios_30);
    setGD(['iso_mvc_re_ri:re'], K.epaule_re); setGD(['iso_mvc_re_ri:ri'], K.epaule_ri);
    const gd = p => (V[p+'_G']!=null || V[p+'_D']!=null) ? {G:V[p+'_G'], D:V[p+'_D']} : null;
    setGD(['single_hop'], gd('hop')); setGD(['triple_hop'], gd('triple')); setGD(['crossover_hop'], gd('cross')); setGD(['side_hop_genou'], gd('side'));
  }
  saveNow();
  return {cree, maj, n:data.cartes.length};
}

const TEAM_GREY = {U17:'#b5b5b5', U19:'#6f6f6f', R1:'#111'};
const FAM_ORDER = ['Première blessure','Récidive','Subséquente','Antérieure au suivi'];
const pct = (x, d=0) => x==null ? '–' : fmt(x*100, d)+' %';
const lev = (a,b) => { const m=a.length, n=b.length; if(!m||!n) return 0; const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=1;j<=n;j++) dp[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return 1-dp[m][n]/Math.max(m,n); };
/* Associe un nom du registre à un joueur de l'application (nom exact, sinon même initiale + nom de famille proche) */
function matchJoueur(nom){
  const k = nkey(nom);
  let j = db.joueurs.find(x=>nkey(x.prenom+x.nom)===k || nkey(x.nom+x.prenom)===k);
  if(j) return j;
  const toks = String(nom).replace(/\(.*?\)/g,'').trim().split(/\s+/).map(nkey).filter(Boolean);
  if(toks.length<2) return null;
  const ini = toks[0][0], rest = toks.slice(1);
  let best=null, bs=0, second=0;
  for(const x of db.joueurs){
    if(nkey(x.prenom)[0]!==ini) continue;
    const xt = String(x.nom).split(/[\s-]+/).map(nkey).filter(t=>t.length>1);
    const s = Math.max(0, ...rest.flatMap(a=>xt.map(b=>lev(a,b))));
    if(s>bs){ second=bs; bs=s; best=x; } else if(s>second) second=s;
  }
  return (best && bs>=0.75 && bs-second>=0.1) ? best : null;
}

function wordsToNums(s){
  const w = s.split(' '), out=[]; let cur=null;
  const flush = () => { if(cur!=null){ out.push(String(cur)); cur=null; } };
  const CTX = new Set(['douleur','gauche','droite','droit','virgule','et']);
  for(let i=0;i<w.length;i++){
    const x=w[i];
    if(x==='et' && cur!=null && (w[i+1] in NUMW)) continue;
    if(x in NUMW){
      if((x==='un'||x==='une') && cur==null && !CTX.has(w[i-1]) && !/^\d/.test(w[i-1]||'')) { out.push(x); continue; }
      const v=NUMW[x];
      if(v===100){ cur=(cur||1)*100; continue; }
      if(cur==null){ cur=v; continue; }
      const r=cur%100;
      if(v===20 && r%20===4){ cur=cur-4+80; continue; }
      if((r===60||r===80) && v<20){ cur+=v; continue; }
      if(r>=20 && r%10===0 && v<10){ cur+=v; continue; }
      if(cur>=100 && r===0 && v<100){ cur+=v; continue; }
      flush(); cur=v; continue;
    }
    flush(); out.push(x);
  }
  flush();
  return out.join(' ').replace(/(\d+) virgule (\d+)/g,'$1.$2');
}

    <p class="small muted">${db.joueurs.length} joueurs · ${db.episodes.length} blessures · ${db.seances.length} séances · ${fmt(size/1024,0)} Ko utilisés</p>
  </div>
  <div class="secbar"><h2>Cartes médicales de présaison</h2></div>
  <div class="card">
    <p style="margin-top:0">Importe le fichier <b>cartes-medicales-presaison-…json</b> (transféré du Mac par AirDrop). Les joueurs absents sont créés, les autres sont complétés. Les valeurs brutes (Kinvent, hop tests) deviennent les références de présaison des séances.</p>
    <label class="btn p" style="display:inline-flex;align-items:center">Importer les cartes médicales<input type="file" id="impC" accept="application/json,.json" style="display:none"></label>
    <p class="small muted">${Object.keys(db.cartes||{}).length} cartes médicales enregistrées sur cet iPad.</p>
  </div>
  <div class="secbar"><h2>Données blessures de la saison</h2></div>
  <div class="card">
    <p style="margin-top:0">Importe le fichier <b>blessures-app-AAAA-MM.json</b> produit par le rapport mensuel (Mac : Data blessures 2026-27 → rapports → mois, transféré par AirDrop). Il remplace les données du mois précédent. Le registre du Mac reste la seule source des statistiques.</p>
    <label class="btn p" style="display:inline-flex;align-items:center">Importer les données blessures<input type="file" id="impB" accept="application/json,.json" style="display:none"></label>

  <div class="secbar"><h2>Essai</h2></div>
  <div class="card"><p style="margin-top:0" class="small">Ajoute 3 joueurs fictifs (préfixe « TEST ») avec des blessures et des séances déjà remplies, pour découvrir l'application. Tu pourras les supprimer ensuite.</p><button class="btn s" id="demo">Ajouter les joueurs fictifs</button> <button class="btn s" id="demoDel">Supprimer les joueurs fictifs</button></div>

  <button class="btn d sm" id="wipe">Effacer toutes les données de cet iPad</button>`;
  try{ if(navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p=>{ $('#persist').textContent = p ? 'Stockage protégé : l’iPad ne supprimera pas ces données de lui-même.' : 'Stockage non garanti par le navigateur : utilise l’application depuis l’icône de l’écran d’accueil et fais des sauvegardes régulières.'; }); else $('#persist').textContent=''; }catch(e){ $('#persist').textContent=''; }
  $('#impC').onchange = e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=async ()=>{ try{ const r=await importCartes(JSON.parse(rd.result)); toast(`${r.n} cartes importées · ${r.cree} joueurs créés · ${r.maj} complétés`); go('#/cartes'); }catch(err){ toast('Fichier de cartes médicales invalide'); } }; rd.readAsText(f); };
  $('#impB').onchange = e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const r=importBlessures(JSON.parse(rd.result)); toast(`Rapport ${r.mois} : ${r.blessures} blessures · ${r.lies}/${r.joueurs} joueurs reliés`); go('#/blessures'); }catch(err){ toast('Fichier blessures invalide'); } }; rd.readAsText(f); };

  $('#imp').onchange = e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=async ()=>{ try{ const d=JSON.parse(rd.result); if(d && d.type==='rtp-amiens-sc-blessures'){ const r=importBlessures(d); toast(`Rapport ${r.mois} importé`); go('#/blessures'); return; } if(d && d.type==='rtp-amiens-sc-cartes-medicales'){ const r=await importCartes(d); toast(`${r.n} cartes importées`); go('#/cartes'); return; } if(!d || !Array.isArray(d.joueurs) || !Array.isArray(d.episodes) || !Array.isArray(d.seances)) throw new Error('format'); const files=d.__files||{}; delete d.__files; for(const [k,v] of Object.entries(files)){ try{ await IDB.put(k, v.s!=null ? v.s : {name:v.name, type:v.type, buf:b642buf(v.b64)}); }catch(_){} } for(const k in PHOTOS) delete PHOTOS[k]; db=Object.assign(blank(), d); saveNow(); toast('Sauvegarde restaurée'); vReglages(); }catch(err){ toast('Fichier de sauvegarde invalide'); } }; rd.readAsText(f); };
  $('#demo').onclick = ()=>{ demo(); saveNow(); toast('Joueurs fictifs ajoutés'); go('#/episodes'); };
  $('#demoDel').onclick = ()=>{ const ids=db.joueurs.filter(j=>j.demo).map(j=>j.id); const eids=db.episodes.filter(e=>ids.includes(e.joueurId)).map(e=>e.id); db.seances=db.seances.filter(s=>!eids.includes(s.episodeId)); db.episodes=db.episodes.filter(e=>!ids.includes(e.joueurId)); ids.forEach(i=>delete db.refs[i]); db.joueurs=db.joueurs.filter(j=>!j.demo); saveNow(); toast('Joueurs fictifs supprimés'); vReglages(); };
  confirm2($('#wipe'), async ()=>{ try{ for(const k of await IDB.keys()) await IDB.del(k); }catch(_){} for(const k in PHOTOS) delete PHOTOS[k]; db=blank(); saveNow(); toast('Toutes les données ont été effacées'); vReglages(); });
}
